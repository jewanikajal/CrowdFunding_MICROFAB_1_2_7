---
# Multi-channel — all 25 T12 ops × low / medium / stress.
# Default for: bash scripts/run-multi-caliper.sh
# (seed-multi-full.sh → seed-state.json → Caliper → report)
test:
  name: crowdfunding-multi-full
  description: Multi T12 — 25 ops × L/M/S + cool-down after each medium and each stress (op TPS unchanged)
  workers:
    number: 2
  rounds:
    - label: low-P01-createStartup
      txNumber: 50
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads/createStartup.js, arguments: { arch: multi } }

    - label: medium-P01-createStartup
      txNumber: 100
      rateControl: { type: fixed-rate, opts: { tps: 25 } }
      workload: { module: workloads/createStartup.js, arguments: { arch: multi } }


    - label: cooldown-after-medium-P01-createStartup
      description: Settle peers before stress (op TPS unchanged)
      txNumber: 2
      rateControl: { type: fixed-rate, opts: { tps: 1 } }
      workload:
        module: workloads/peerCooldown.js
        arguments:
          arch: multi
          pauseMs: 30000
          pollMs: 2000
          maxWaitMs: 180000
          readyQueries: 2
          probeGovernance: true
          healthUrl: http://127.0.0.1:8080/ak/api/v1/health

    - label: stress-P01-createStartup
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: workloads/createStartup.js, arguments: { arch: multi } }


    - label: cooldown-after-stress-P01-createStartup
      description: Settle peers before next op (op TPS unchanged)
      txNumber: 4
      rateControl: { type: fixed-rate, opts: { tps: 1 } }
      workload:
        module: workloads/peerCooldown.js
        arguments:
          arch: multi
          pauseMs: 60000
          pollMs: 2000
          maxWaitMs: 180000
          readyQueries: 2
          probeGovernance: true
          healthUrl: http://127.0.0.1:8080/ak/api/v1/health

    - label: low-P02-createCampaign
      description: Self-contained (startup+campaign per submit)
      txNumber: 50
      rateControl: { type: fixed-rate, opts: { tps: 10 } }

    - label: low-P10-makeInvestment
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: makeInvestment, poolSize: 5, arch: dual, campaignId: CAMP001, investorId: INVESTOR001, amount: "20000000" } }

    - label: low-P11-createInvestmentProposal
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: createInvestmentProposal, poolSize: 5, arch: dual } }

    - label: low-P12-respondToInvestmentProposal

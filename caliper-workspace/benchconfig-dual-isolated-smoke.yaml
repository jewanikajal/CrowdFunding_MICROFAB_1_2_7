---
# Dual-channel — all 25 T12 ops × low / medium / stress.
# Default for: bash scripts/run-dual-caliper.sh
# (seed-dual-full.sh → seed-state.json → Caliper → report)
test:
  name: crowdfunding-dual-isolated
  description: Dual T12 — 25 ops × L/M/S + cool-down after each medium and each stress (op TPS unchanged)
  workers:
    number: 2
  rounds:
    - label: low-P01-createStartup
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: createStartup, poolSize: 5, arch: dual } }

    - label: low-P02-createCampaign
      description: Self-contained (startup+campaign per submit)
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: createCampaign, poolSize: 5, arch: dual } }

    - label: low-P03-submitForValidation
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: submitForValidation, poolSize: 5, arch: dual } }

    - label: low-P04-validateCampaign
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: validateCampaign, poolSize: 5, arch: dual } }

    - label: low-P05-approveOrRejectCampaign
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }

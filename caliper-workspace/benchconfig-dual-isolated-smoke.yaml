    - label: low-P08-registerInvestor
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: workloads-isolated/isolated.js, arguments: { op: registerInvestor, poolSize: 5, arch: dual } }

    - label: low-P09-viewCampaign
      txNumber: 6
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
